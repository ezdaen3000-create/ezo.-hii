<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PyVerse | عالم بايثون والمشاريع</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#05060f;--panel:rgba(255,255,255,.05);--line:rgba(255,255,255,.1);--text:#e8ecff;--muted:#8f98c0;--c1:#00e5ff;--c2:#8b5cf6;--c3:#ff3dcb}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);line-height:1.8;overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:-1}
a{color:inherit;text-decoration:none}
.nav{position:fixed;top:0;inset-inline:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:12px 5%;backdrop-filter:blur(14px);background:rgba(5,6,15,.6);border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:1.3rem}
.logo span,.grad{background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3));-webkit-background-clip:text;background-clip:text;color:transparent}
.nav nav{display:flex;gap:14px}
.nav nav a{color:var(--muted);font-size:.85rem}
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:100px 6% 50px}
.tag{font-family:'JetBrains Mono',monospace;color:var(--c1);direction:ltr}
.hero h1{font-size:clamp(2.2rem,8vw,4.5rem);font-weight:800;line-height:1.3}
.lead{max-width:620px;color:var(--muted);margin:16px 0 26px}
.actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{padding:12px 26px;border-radius:50px;font-family:inherit;font-weight:600;font-size:1rem;cursor:pointer;border:1px solid transparent;transition:.3s}
.primary{background:linear-gradient(90deg,var(--c1),var(--c2));color:#05060f;box-shadow:0 0 25px rgba(0,229,255,.35)}
.ghost{border-color:var(--c2);color:var(--text)}
.stats{display:flex;gap:36px;margin-top:50px;flex-wrap:wrap;justify-content:center}
.stats div{display:flex;flex-direction:column}
.stats b{font-size:2rem;color:var(--c1);font-family:'JetBrains Mono',monospace}
.stats span{color:var(--muted);font-size:.8rem}
.section{max-width:1100px;margin:auto;padding:80px 6%}
.section h2{font-size:clamp(1.8rem,5vw,2.5rem);font-weight:800}
.sub{color:var(--muted);margin:6px 0 30px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;backdrop-filter:blur(10px);transition:.35s}
.card:hover{transform:translateY(-6px);border-color:var(--c1);box-shadow:0 10px 40px rgba(0,229,255,.15)}
.ico{font-size:2rem}
.card p{color:var(--muted);font-size:.95rem}
.code-box{margin-top:30px;border:1px solid var(--line);border-radius:14px;background:#0a0c1c;overflow:hidden}
.code-head{display:flex;gap:7px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);direction:ltr}
.code-head i{width:11px;height:11px;border-radius:50%;background:#ff5f56}
.code-head i:nth-child(2){background:#ffbd2e}.code-head i:nth-child(3){background:#27c93f}
.code-head span{margin-inline-start:auto;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:.8rem}
pre{padding:16px;overflow-x:auto;font-family:'JetBrains Mono',monospace;font-size:.85rem;line-height:1.7}
.k{color:var(--c3)}.f{color:var(--c1)}.s{color:#a3e635}
.proj img{width:100%;height:150px;object-fit:cover;border-radius:12px;margin-bottom:10px}
.ph{height:150px;border-radius:12px;margin-bottom:10px;display:grid;place-items:center;font-size:3rem;background:linear-gradient(135deg,rgba(0,229,255,.2),rgba(139,92,246,.25))}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tags span{font-size:.75rem;padding:2px 10px;border-radius:20px;background:rgba(139,92,246,.2);color:var(--c1)}
.row{display:flex;justify-content:space-between;align-items:center}
.proj a{color:var(--c1);font-weight:600}
.del{background:none;border:none;color:#ff6b81;cursor:pointer;font-family:inherit}
.empty{text-align:center;color:var(--muted);padding:26px}
.form{display:grid;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px}
.form label{display:grid;gap:6px;color:var(--muted);font-size:.9rem}
.form input,.form textarea{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--text);font-family:inherit;font-size:1rem}
.form input:focus,.form textarea:focus{outline:none;border-color:var(--c1)}
.timeline{display:grid;gap:14px;border-inline-start:2px solid var(--line);padding-inline-start:22px}
.step{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.step::before{content:"";position:absolute;inset-inline-start:-31px;top:20px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--c2)}
